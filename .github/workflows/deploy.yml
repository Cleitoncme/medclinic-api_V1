name: Publicacao no Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  publicacao:
    if: github.repository == 'Cleitoncme/medclinic-api_V1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuracao de publicacao
        shell: bash
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Configure a variavel GCP_PROJECT_ID}"
          : "${GCP_REGION:?Configure a variavel GCP_REGION}"
          : "${GAR_REPOSITORY:?Configure a variavel GAR_REPOSITORY}"
          : "${CLOUD_RUN_SERVICE:?Configure a variavel CLOUD_RUN_SERVICE}"
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Configure a variavel GCP_WORKLOAD_IDENTITY_PROVIDER}"
          : "${GCP_DEPLOY_SERVICE_ACCOUNT:?Configure a variavel GCP_DEPLOY_SERVICE_ACCOUNT}"
          echo "IMAGE=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/medclinic-api-v1:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Construir imagem sem segredos da aplicacao
        run: docker build --tag "$IMAGE" .
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verificar servico previamente configurado
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(metadata.name)'
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Publicar imagem no Artifact Registry
        run: docker push "$IMAGE"
      - name: Atualizar imagem no Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          image: ${{ env.IMAGE }}
          env_vars_update_strategy: merge
          secrets_update_strategy: merge
      - name: Verificar health publicado
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --max-time 15 "${SERVICE_URL}/api/v1/health"
