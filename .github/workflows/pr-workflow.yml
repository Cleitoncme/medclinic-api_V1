name: Validacao de pull request

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validacao:
    name: validacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar e executar testes de regressao
        run: npm run test:regression
      - name: Verificar tipos dos testes unitarios
        run: npm run test:typecheck
      - name: Testes unitarios e cobertura minima de 80%
        run: npm run test:cov
      - name: Verificar lint
        run: npm run lint
      - name: Verificar formatacao
        run: npm run format:check
      - name: Verificar imagem Docker
        run: docker build --tag medclinic-api-v1:pr .
